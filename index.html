<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test dépôt CV</title>
<style>
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;max-width:480px;margin:0 auto;padding:24px 16px;background:#fff;color:#1a1a1a}
  h1{font-size:22px;color:#1F4E8C}
  label{display:block;margin:18px 0 6px;font-weight:600}
  input[type=text],input[type=file]{width:100%;box-sizing:border-box;padding:10px;border:1px solid #ccc;border-radius:8px;font-size:16px}
  button{margin-top:24px;width:100%;padding:14px;border:0;border-radius:8px;background:#1F4E8C;color:#fff;font-size:17px;font-weight:600}
</style>
</head>
<body>
<h1>TEST – Dépôt de CV</h1>
<form action="https://formsubmit.co/vincent.heyne@pigier.com" method="POST" enctype="multipart/form-data">
  <input type="hidden" name="_subject" value="TEST FormSubmit Pigier">
  <input type="hidden" name="_template" value="table">
  <label for="nom">Nom</label>
  <input type="text" id="nom" name="Nom" required>
  <label for="cv">Ton CV (PDF, JPEG ou PNG)</label>
  <input type="file" id="cv" name="CV" accept=".pdf,.jpg,.jpeg,.png,image/*,application/pdf" required>
  <button type="submit">Envoyer</button>
</form>
</body>
</html>
